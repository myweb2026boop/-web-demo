<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AI 手机模拟器</title>
<style>
:root {
  --wx-bg: #ededed;
  --wx-text: #111827;
  --wx-text-secondary: #6b7280;
  --wx-border: #e5e7eb;
  --wx-search-bg: #ffffff;
  --mus-bg: #000000;
  --mus-bg-secondary: #222222;
  --mus-text: #ffffff;
  --mus-text-secondary: #aaa;
  --mus-border: #333;
  --mus-accent: #10B981;
  --app-height: 100vh;
}
html, body { margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#fff; height:var(--app-height); overflow:hidden; }
.screen { display: none; position:absolute; top:0; left:0; width:100%; height:var(--app-height); background:#fff; flex-direction:column; overflow:hidden; box-sizing:border-box; }
.screen.active { display:flex; }
#homeScreen { background:#f7f8fa; padding:16px; box-sizing:border-box; }
.top-widget-container { margin-bottom:16px; }
.widget-header { display:flex; justify-content:space-between; font-size:14px; color:#666; margin-bottom:8px; }
.widget-image-box { background:#fff; border-radius:16px; padding:12px; }
.widget-input-box { margin-top:10px; background:#fff; border-radius:12px; padding:12px; display:flex; align-items:center; gap:8px; }
.widget-footer { margin-top:6px; font-size:12px; color:#888; text-align:right; }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; }
.app { display:flex; flex-direction:column; align-items:center; gap:6px; }
.app-icon { width:60px; height:60px; border-radius:12px; overflow:hidden; }
.app-name { font-size:12px; color:#222; }
.widget { height:120px; }
.widget-ghost { width:100%; height:100%; border-radius:16px; background:rgba(255,255,255,0.7); }

/* 通用页面头部 */
.profile-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #eee; flex-shrink:0; background:#fff; }
.btn-back,.btn-add,.btn-save { border:none; background:none; font-size:16px; cursor:pointer; }
.btn-add { color:#10B981; font-weight:bold; font-size:22px; }
.profile-list { flex:1; overflow-y:auto; padding:12px; }
.profile-card { display:flex; gap:12px; background:#fff; padding:12px; border-radius:12px; margin-bottom:10px; }
.profile-card-img { width:48px; height:48px; border-radius:50%; overflow:hidden; flex-shrink:0; }
.profile-card-img img { width:100%; height:100%; object-fit:cover; }
.profile-card-info h4 { margin:0; font-size:15px; }
.profile-card-info p { margin:4px 0 0; font-size:12px; color:#666; }
.profile-edit-form { padding:16px; overflow-y:auto; flex:1; }
.profile-form-group { margin-bottom:16px; }
.profile-form-group label { display:block; font-size:14px; margin-bottom:6px; color:#444; }
.profile-form-group input,.profile-form-group textarea { width:100%; box-sizing:border-box; border:1px solid #ddd; border-radius:8px; padding:10px; font-size:15px; }
.profile-form-group textarea { min-height:120px; }
.file-upload-btn { background:#eef2ff; color:#4f46e5; border-radius:8px; padding:10px; text-align:center; cursor:pointer; font-size:14px; }
.profile-avatar-upload { display:flex; align-items:center; gap:12px; }
#peAvatarPreview { width:64px; height:64px; border-radius:50%; overflow:hidden; cursor:pointer; }
#peAvatarPreview img { width:100%; height:100%; object-fit:cover; }
.wb-radio-group { display:flex; gap:16px; }
.wb-card { display:flex; align-items:center; justify-content:space-between; background:#fff; padding:12px; border-radius:12px; margin-bottom:10px; }
.wb-card-left { display:flex; gap:12px; align-items:center; }
.wb-card-img { width:48px; height:48px; border-radius:8px; overflow:hidden; flex-shrink:0; }
.wb-card-info h4 { margin:0; font-size:15px; }
.wb-card-info p { margin:4px 0 0; font-size:12px; color:#666; }
.wb-card-delete { color:#ef4444; background:none; border:none; cursor:pointer; font-size:14px; }

/* 微信页面 */
#wechatScreen { background:var(--wx-bg); }
.wx-main-content { flex:1; overflow:hidden; display:flex; flex-direction:column; }
.wx-page { display:none; flex-direction:column; height:100%; }
.wx-page.active { display:flex; }
.wx-header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--wx-search-bg); flex-shrink:0; }
.wx-header h2 { margin:0; font-size:18px; font-weight:600; }
.wx-menu-btn { background:none; border:none; padding:4px; cursor:pointer; }
.wx-menu-btn svg { width:24px; height:24px; fill:#333; }
.wx-search-container { padding:8px 12px; background:var(--wx-search-bg); flex-shrink:0; }
.wx-search-box { display:flex; align-items:center; gap:6px; background:#f4f4f4; border-radius:8px; padding:8px 10px; }
.wx-search-box svg { width:18px; height:18px; fill:#888; }
.wx-search-box input { flex:1; border:none; outline:none; background:transparent; font-size:14px; }
.wx-chat-list { flex:1; overflow-y:auto; background:var(--wx-search-bg); }
.wx-chat-item { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid #eee; cursor:pointer; }
.wx-avatar { width:48px; height:48px; border-radius:8px; overflow:hidden; flex-shrink:0; }
.wx-avatar svg { width:100%; height:100%; }
.wx-chat-info { flex:1; min-width:0; }
.wx-chat-top { display:flex; justify-content:space-between; margin-bottom:4px; }
.wx-chat-name { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wx-chat-time { font-size:12px; color:#999; }
.wx-chat-preview { font-size:13px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wx-tabbar { display:flex; border-top:1px solid #ddd; background:#fff; flex-shrink:0; }
.wx-tab-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:4px; color:#888; cursor:pointer; font-size:11px; }
.wx-tab-item.active { color:#10B981; }
.wx-tab-item svg { width:24px; height:24px; fill:currentColor; }
.wx-empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#888; padding:20px; text-align:center; }
.wx-empty-state svg { width:60px; height:60px; fill:#ccc; margin-bottom:12px; }
.wx-contact-list { flex:1; overflow-y:auto; background:#fff; }
.wx-contact-item { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid #eee; cursor:pointer; }
.wx-contact-info h4 { margin:0; font-size:15px; }
.wx-contact-info p { margin:3px 0 0; font-size:12px; color:#666; }

/* 微信聊天页 */
#wechatChatDetail { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:#ededed; flex-direction:column; z-index:999; }
#wechatChatDetail.active { display:flex; }
.wx-chat-detail-header { display:flex; align-items:center; padding:12px 16px; background:#fff; flex-shrink:0; border-bottom:1px solid #eee; }
.wx-chat-detail-back,.wx-chat-detail-settings { background:none; border:none; cursor:pointer; padding:4px; }
.wx-chat-detail-back svg,.wx-chat-detail-settings svg { width:24px; height:24px; fill:#333; }
.wx-chat-detail-title { flex:1; text-align:center; font-size:17px; font-weight:500; }
.wx-chat-messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
.wx-chat-input-bar { display:flex; gap:8px; padding:8px 12px; background:#fff; border-top:1px solid #ddd; flex-shrink:0; }
.wx-chat-input-bar input { flex:1; border:1px solid #ddd; border-radius:20px; padding:8px 14px; outline:none; font-size:15px; }
.wx-chat-input-bar button { border:none; background:#10B981; color:#fff; border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.wx-chat-input-bar button svg { width:18px; height:18px; fill:#fff; }

/* 聊天详情页面 */
#wxChatDetailScreen { background:#f7f8fa; }
.wx-chat-detail-avatar { display:flex; flex-direction:column; align-items:center; padding:20px; background:#fff; border-bottom:8px solid #f7f8fa; }
#chatDetailAvatarImg { width:80px; height:80px; border-radius:8px; overflow:hidden; margin-bottom:10px; cursor:pointer; }
#chatDetailAvatarImg img { width:100%; height:100%; object-fit:cover; }
.wx-chat-detail-avatar-name { font-size:17px; font-weight:500; }
.wx-chat-detail-item { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:#fff; border-bottom:1px solid #eee; cursor:pointer; }
.wx-chat-detail-text { font-size:15px; }
.wx-chat-detail-right { display:flex; align-items:center; gap:6px; color:#999; font-size:14px; }
.wx-chat-detail-right svg { width:18px; height:18px; fill:#ccc; }
.toggle-switch { width:44px; height:24px; border-radius:12px; background:#ddd; position:relative; transition:0.2s; }
.toggle-switch.active { background:#10B981; }
.toggle-switch::after { content:""; position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:0.2s; }
.toggle-switch.active::after { left:22px; }
.wx-chat-detail-danger { color:#ef4444; }

/* 朋友圈 */
#wxMomentsPage { background:#f7f8fa; }
.wx-moments-profile { background:#fff; }
.wx-moments-bg { height:220px; position:relative; display:flex; align-items:flex-end; padding:16px; box-sizing:border-box; background:#f0f0f0; cursor:pointer; }
.bg-hint { position:absolute; top:10px; left:10px; font-size:12px; color:#555; }
.wx-moments-userinfo { display:flex; flex-direction:column; align-items:flex-end; margin-left:auto; }
.wx-moments-name { font-size:22px; font-weight:bold; color:#fff; text-shadow:0 0 4px #000; margin-bottom:6px; }
.wx-moments-avatar { width:72px; height:72px; border-radius:50%; overflow:hidden; border:3px solid #fff; cursor:pointer; }
.wx-moments-avatar svg { width:100%; height:100%; }
.wx-moments-sign { margin-top:8px; font-size:14px; color:#fff; text-shadow:0 0 4px #000; }
.wx-moments-scroll { flex:1; overflow-y:auto; }
.wx-moments-list { padding:12px; }
.wx-moment-item { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; }
.wx-moment-author { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.wx-moment-avatar { width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0; }
.wx-moment-avatar img { width:100%; height:100%; object-fit:cover; }
.wx-moment-name { font-weight:500; font-size:15px; }
.wx-moment-text { font-size:15px; line-height:1.5; margin-bottom:10px; }
.wx-moment-images { display:grid; gap:4px; margin-bottom:10px; }
.wx-moment-images { grid-template-columns: repeat(3, 1fr); }
.wx-moment-images.two { grid-template-columns: repeat(2, 1fr); }
.wx-moment-images.single { grid-template-columns: 1fr; }
.wx-moment-images img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; cursor:pointer; }
.wx-moment-footer { display:flex; align-items:center; justify-content:space-between; color:#999; font-size:12px; }
.wx-moment-ip { margin-left:8px; }
.wx-moment-action { font-size:20px; cursor:pointer; }
.wx-moment-like-comment { background:#f6f6f6; padding:8px; border-radius:8px; margin:8px 0; font-size:13px; color:#555; }
.wx-moment-comment-list { background:#f6f6f6; padding:8px; border-radius:8px; margin:8px 0; font-size:13px; }
.wx-moment-comment-list .c-name { color:#0066cc; }
.wx-moment-visible-tag { color:#0066cc; margin-left:8px; }
.wx-moment-empty { text-align:center; padding:40px; color:#888; }

/* 朋友圈发布弹窗 */
#wxMomentEditScreen { background:#ffffff; }
.wx-moment-edit-header { display:flex; align-items:center; justify-content:space-between; padding:12px 15px; border-bottom:1px solid #f0f0f0; flex-shrink:0; }
.cancel-btn,.publish-btn { border:none; background:none; font-size:15px; cursor:pointer; }
.publish-btn { background:#10B981; color:#fff; padding:6px 16px; border-radius:6px; font-weight:600; }
.publish-btn.disabled { background:#e5e7eb; color:#9ca3af; cursor:not-allowed; }
.title { font-size:17px; font-weight:600; }
.wx-moment-edit-body { flex:1; padding:15px; overflow-y:auto; display:flex; flex-direction:column; }
.wx-moment-author-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; color:#6b7280; }
.wx-moment-author-row select { border:1px solid #e5e7eb; border-radius:6px; padding:4px 8px; font-size:13px; background:#f9fafb; outline:none; }
.wx-moment-text-input { flex:1; min-height:160px; border:none; outline:none; font-size:16px; color:#111; resize:none; font-family:inherit; line-height:1.5; padding:0; background:transparent; }
.wx-moment-text-input::placeholder { color:#9ca3af; }
.wx-moment-images-preview { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:12px; }
.img-item { position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; background:#f3f4f6; }
.img-item img { width:100%; height:100%; object-fit:cover; }
.remove-btn { position:absolute; top:4px; right:4px; width:22px; height:22px; background:rgba(0,0,0,0.6); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; line-height:1; }
.wx-moment-add-image { width:80px; height:80px; border:1px dashed #d1d5db; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#f9fafb; flex-shrink:0; }
.wx-moment-add-image svg { width:28px; height:28px; fill:#9ca3af; }
.wx-moment-edit-footer { border-top:1px solid #f0f0f0; flex-shrink:0; background:#ffffff; }
.wx-moment-edit-item { display:flex; align-items:center; padding:14px 20px; border-bottom:1px solid #f0f0f0; cursor:pointer; font-size:15px; color:#111; }
.wx-moment-edit-item svg:first-child { width:20px; height:20px; fill:#111; margin-right:12px; flex-shrink:0; }
.label { flex:1; }
.value { color:#9ca3af; font-size:14px; margin-right:4px; }
.arrow { width:16px; height:16px; fill:#d1d5db; margin:0; }

#wxMomentImageScreen { background:#000; display:none; flex-direction:column; justify-content:center; align-items:center; }
#wxMomentImageScreen.active { display:flex; }
#momentImageFull { max-width:95vw; max-height:80vh; object-fit:contain; }
.close-btn { position:absolute; top:15px; right:20px; width:36px; height:36px; background:rgba(255,255,255,0.15); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.close-btn svg { width:20px; height:20px; fill:#fff; }

.wx-moment-action-menu { position:fixed; z-index:100; background:#222; border-radius:10px; color:#fff; overflow:hidden; display:none; }
.wx-moment-action-menu.show { display:block; }
.menu-item { display:flex; align-items:center; gap:10px; padding:11px 18px; cursor:pointer; white-space:nowrap; }
.menu-item:active { background:rgba(255,255,255,0.12); }
.menu-item.danger { color:#ff453a; }
.menu-item svg { width:18px; height:18px; fill:#fff; flex-shrink:0; }

/* 弹窗 */
.wx-modal { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:10050; display:none; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
.wx-modal.show { display:flex; }
.wx-modal-content { width:100%; max-width:420px; background:#fff; border-radius:12px; overflow:hidden; }
.wx-modal-header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #eee; }
.wx-modal-btn { background:none; border:none; font-size:15px; cursor:pointer; padding:4px 8px; }
.wx-modal-btn.primary { color:#10B981; font-weight:bold; }
.wx-select-item { padding:12px 16px; background:#f9fafb; border-radius:10px; cursor:pointer; font-size:15px; color:#111827; border:2px solid transparent; display:flex; align-items:center; gap:10px; }
.wx-select-item:active { background:#f3f4f6; }
.wx-select-item.selected { background:#ecfdf5; border-color:#10B981; color:#10B981; font-weight:600; }
.wx-select-item .check { width:20px; height:20px; border-radius:50%; border:2px solid #d1d5db; flex-shrink:0; position:relative; margin-left:auto; }
.wx-select-item.selected .check { background:#10B981; border-color:#10B981; }
.wx-select-item.selected .check::after { content:''; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
.wx-select-item .avatar { width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0; }
.wx-select-item .avatar img { width:100%; height:100%; object-fit:cover; }

/* 搜索聊天记录 */
#wxSearchChatHistoryScreen { background:#ededed; }
.wx-search-header { display:flex; align-items:center; padding:10px 15px; background:#ededed; flex-shrink:0; }
.back-btn { width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-right:5px; }
.back-btn svg { width:20px; height:20px; fill:#111; }
.search-input-box { flex:1; display:flex; align-items:center; background:#ffffff; border-radius:6px; padding:6px 10px; margin-right:10px; }
.search-input-box svg { width:16px; height:16px; fill:#999; margin-right:5px; }
.search-input-box input { border:none; outline:none; flex:1; font-size:14px; background:transparent; }
.cancel-btn { font-size:15px; color:#576b95; cursor:pointer; flex-shrink:0; }
.wx-search-tabs { display:flex; background:#ffffff; border-bottom:1px solid #e5e5e5; flex-shrink:0; }
.wx-search-tab { flex:1; text-align:center; padding:12px 0; font-size:14px; color:#666; cursor:pointer; border-bottom:2px solid transparent; }
.wx-search-tab.active { color:#07c160; border-bottom-color:#07c160; font-weight:600; }
.wx-search-results { flex:1; overflow-y:auto; background:#ffffff; }
.wx-search-result-item { display:flex; padding:12px 15px; border-bottom:1px solid #f0f0f0; }
.wx-search-result-item .avatar { width:40px; height:40px; border-radius:6px; overflow:hidden; margin-right:12px; flex-shrink:0; background:#eee; display:flex; justify-content:center; align-items:center; }
.wx-search-result-item .avatar img { width:100%; height:100%; object-fit:cover; }
.wx-search-result-item .content { flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; }
.wx-search-result-item .content .sender { font-size:13px; color:#666; margin-bottom:4px; }
.wx-search-result-item .content .message { font-size:15px; color:#111; word-break:break-word; }
.wx-search-result-item .content .message span.highlight { color:#07c160; }
.wx-search-result-item .time { font-size:12px; color:#999; margin-left:10px; flex-shrink:0; align-self:flex-start; }
.wx-search-empty { text-align:center; padding:80px 20px; color:#999; font-size:14px; }

/* 设置页面 */
#wxApiSettingsScreen { background:#fff; }
.wx-api-form { padding:20px; display:flex; flex-direction:column; gap:16px; overflow-y:auto; flex:1; }
.wx-api-group { display:flex; flex-direction:column; gap:8px; }
.wx-api-group label { font-size:13px; color:#444; font-weight:500; }
.wx-api-group input,.wx-api-group textarea { border:1px solid #e5e7eb; border-radius:10px; padding:12px; font-size:14px; width:100%; box-sizing:border-box; outline:none; background:#f9fafb; }
.wx-api-group input:focus,.wx-api-group textarea:focus { border-color:#10B981; background:#fff; }
.wx-api-slider-row { display:flex; align-items:center; gap:10px; }
.wx-api-slider-row input[type="range"] { flex:1; accent-color:#10B981; }
.wx-api-slider-row span { font-size:14px; min-width:30px; text-align:right; }
.wx-api-preset-row { display:flex; gap:10px; align-items:center; }
.wx-api-preset-row select { flex:1; border:1px solid #e5e7eb; border-radius:8px; padding:8px; font-size:13px; background:#f9fafb; outline:none; }
.wx-api-btn { background:#10B981; color:#fff; border:none; padding:12px; border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
.wx-api-btn.secondary { background:#f9fafb; color:#111; border:1px solid #e5e7eb; }
.wx-api-status { font-size:13px; text-align:center; }

/* 世界书绑定 */
#wbBindingScreen { background:#fff; }
.wb-binding-header { display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid #eee; flex-shrink:0; }
.wb-binding-back svg { width:24px; height:24px; fill:#333; cursor:pointer; }
.wb-binding-title { flex:1; text-align:center; font-size:17px; font-weight:600; }
.wb-binding-tip { padding:12px 20px; font-size:13px; color:#666; }
.wb-binding-list { flex:1; overflow-y:auto; padding:0 20px; }
.wb-binding-item { display:flex; align-items:center; gap:10px; padding:12px; border-radius:10px; background:#f9fafb; margin-bottom:8px; cursor:pointer; }
.wb-binding-item.selected { background:#ecfdf5; border:2px solid #10B981; }
.wb-binding-item-icon { width:44px; height:44px; flex-shrink:0; }
.wb-binding-item-info h4 { margin:0; font-size:15px; }
.wb-binding-item-info p { margin:3px 0 0; font-size:12px; color:#666; }
.wb-binding-item-check { width:20px; height:20px; border-radius:50%; border:2px solid #d1d5db; margin-left:auto; position:relative; }
.wb-binding-item.selected .wb-binding-item-check { background:#10B981; border-color:#10B981; }
.wb-binding-item.selected .wb-binding-item-check::after { content:''; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
.wb-binding-empty { text-align:center; padding:30px 10px; color:#888; }
.wb-binding-footer { display:flex; gap:12px; padding:16px 20px; border-top:1px solid #eee; flex-shrink:0; }
.btn-clear { flex:1; border:1px solid #ddd; background:#f9fafb; padding:12px; border-radius:10px; font-size:15px; cursor:pointer; }
.btn-confirm { flex:1; border:none; background:#10B981; color:#fff; padding:12px; border-radius:10px; font-size:15px; cursor:pointer; }

/* 美化页面 */
#beautifyScreen { background:#fff; }
.beautify-header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid #f3f4f6; flex-shrink:0; }
.btn-back,.export-btn,.import-btn,.fullscreen-btn { border:none; background:#f3f4f6; color:#4B5563; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
.fullscreen-btn.active { background:#1E3A8A; color:#ffffff; }
.app-edit-list { flex:1; overflow-y:auto; padding:0 20px; }
.app-edit-item { display:flex; align-items:center; padding:15px 0; border-bottom:1px solid #f9fafb; }
.edit-app-icon { width:44px; height:44px; border-radius:10px; overflow:hidden; margin-right:15px; flex-shrink:0; display:flex; justify-content:center; align-items:center; background:#f9fafb; }
.edit-input-group { display:flex; flex-direction:column; flex:1; margin-right:10px; }
.edit-input-group label { font-size:10px; color:#9CA3AF; margin-bottom:4px; }
.edit-input-group input { border:1px solid #E5E7EB; border-radius:8px; padding:8px 12px; font-size:14px; width:100%; box-sizing:border-box; outline:none; background:#f9fafb; }
.edit-input-group input:focus { border-color:#BAE6FD; background:#fff; }
.upload-icon-btn { background:#FCE7F3; color:#BE185D; border:none; padding:10px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
.bottom-tip { text-align:center; font-size:11px; color:#9CA3AF; padding:15px; flex-shrink:0; }

/* 音乐页面 */
#musicScreen { background:var(--mus-bg); color:var(--mus-text); overflow:hidden; }
.music-header { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; flex-shrink:0; }
.music-header svg { width:24px; height:24px; fill:var(--mus-text); cursor:pointer; }
.music-top-deco { width:100%; height:120px; flex-shrink:0; display:flex; justify-content:center; align-items:center; background-size:cover; background-position:center; position:relative; background-color:var(--mus-bg-secondary); }
.music-top-deco span { font-family:'Georgia', serif; font-size:12px; color:var(--mus-text-secondary); position:absolute; bottom:10px; }
.music-user-card { margin:0 20px 15px 20px; background:var(--mus-bg); border:1px solid var(--mus-border); border-radius:20px; padding:15px; display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
.music-user-top { display:flex; align-items:center; gap:12px; }
.music-avatar { width:50px; height:50px; border-radius:50%; overflow:hidden; background:var(--mus-bg-secondary); flex-shrink:0; display:flex; justify-content:center; align-items:center; cursor:pointer; }
.music-avatar img { width:100%; height:100%; object-fit:cover; }
.music-user-info { flex:1; display:flex; flex-direction:column; gap:4px; }
.music-user-info h3 { font-size:16px; font-weight:700; margin:0; }
.music-user-info p { font-size:11px; color:var(--mus-text-secondary); margin:0; }
.music-edit-btn { background:var(--mus-bg-secondary); border:1px solid var(--mus-border); padding:4px 10px; border-radius:12px; font-size:11px; color:var(--mus-text); font-weight:600; cursor:pointer; }
.music-user-stats { display:flex; justify-content:space-around; border-top:1px solid var(--mus-border); padding-top:10px; }
.music-stat-item { display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
.music-stat-item span:first-child { font-size:14px; font-weight:bold; }
.music-stat-item span:last-child { font-size:10px; color:var(--mus-text-secondary); }
.music-upload-section { margin:0 20px 15px 20px; background:var(--mus-bg); border:1px solid var(--mus-border); border-radius:20px; padding:15px; flex:1; display:flex; flex-direction:column; overflow:hidden; }
.music-section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.music-section-header span { font-size:15px; font-weight:700; }
.uploadMp3Btn { background:var(--mus-bg-secondary); color:var(--mus-text); border:1px solid var(--mus-border); padding:6px 12px; border-radius:15px; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; }
.uploadMp3Btn svg { width:14px; height:14px; fill:var(--mus-text); }
.music-list-container { flex:1; overflow-y:auto; }
.music-empty-state { text-align:center; padding:30px 0; font-size:12px; color:var(--mus-text-secondary); }
.music-file-item { display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid var(--mus-border); cursor:pointer; }
.music-file-item:active { background:var(--mus-bg-secondary); }
.music-file-name { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; margin-right:10px; }
.music-play-icon svg { width:18px; height:18px; fill:var(--mus-text); }
.music-player-bar { height:auto; min-height:65px; flex-shrink:0; background:var(--mus-bg-secondary); display:flex; align-items:center; padding:10px 15px; gap:12px; border-top:1px solid var(--mus-border); cursor:pointer; }
.miniThumb { width:45px; height:45px; border-radius:6px; overflow:hidden; background:#ddd; flex-shrink:0; }
.miniThumb img { width:100%; height:100%; object-fit:cover; }
.music-player-info { flex:1; display:flex; flex-direction:column; gap:4px; }
.song-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.artist-name { font-size:10px; color:var(--mus-text-secondary); }
.music-player-controls { display:flex; gap:15px; align-items:center; }
.music-player-controls svg { width:22px; height:22px; fill:var(--mus-text); cursor:pointer; }

#musicEditScreen { background:var(--mus-bg); color:var(--mus-text); }
.music-edit-header { display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--mus-border); flex-shrink:0; }
.music-edit-header svg { width:20px; height:20px; fill:var(--mus-text); cursor:pointer; margin-right:15px; }
.music-edit-header h2 { font-size:17px; font-weight:600; margin:0; }
.music-edit-form { padding:20px; display:flex; flex-direction:column; gap:20px; overflow-y:auto; flex:1; }
.music-edit-item { display:flex; flex-direction:column; gap:8px; }
.music-edit-item label { font-size:13px; color:var(--mus-text-secondary); }
.music-edit-item input { background:var(--mus-bg-secondary); border:1px solid var(--mus-border); padding:12px; border-radius:10px; font-size:14px; color:var(--mus-text); outline:none; }
.music-edit-avatar-row { display:flex; align-items:center; gap:15px; }
#editAvatarPreview { width:60px; height:60px; border-radius:50%; overflow:hidden; background:#eee; }
#editAvatarPreview img { width:100%; height:100%; object-fit:cover; }
.music-edit-btn-sm { background:var(--mus-bg-secondary); border:1px solid var(--mus-border); padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; }
#editBgPreview { width:100%; height:120px; border-radius:10px; overflow:hidden; background:#eee; }
#editBgPreview img { width:100%; height:100%; object-fit:cover; }
.music-edit-save-btn { background:var(--mus-accent); color:#fff; border:none; padding:15px; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; margin-top:20px; }

#musicPlayerScreen { background:#ffffff; display:none; flex-direction:column; overflow:hidden; }
#musicPlayerScreen.active { display:flex; }
.mp-bg-layer { position:absolute; top:0; left:0; right:0; bottom:0; background-size:cover; background-position:center; filter:blur(30px); opacity:0.3; z-index:0; }
.mp-content { flex:1; display:flex; flex-direction:column; position:relative; z-index:1; min-height:0; }
.mp-header { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; flex-shrink:0; z-index:1; }
.mp-header svg { width:24px; height:24px; fill:#333; cursor:pointer; }
.mp-disc-area { flex:1; display:flex; justify-content:center; align-items:center; position:relative; z-index:1; min-height:250px; }
.mp-disc { width:80vw; height:80vw; max-width:320px; max-height:320px; border-radius:50%; background:radial-gradient(circle, #333 10%, #111 40%, #000 100%); display:flex; justify-content:center; align-items:center; box-shadow:0 10px 30px rgba(0,0,0,0.4); position:relative; cursor:pointer; animation:spin 20s linear infinite; animation-play-state:paused; }
.mp-disc.playing { animation-play-state:running; }
@keyframes spin { 100% { transform:rotate(360deg); } }
.mp-disc-center { width:65%; height:65%; border-radius:50%; overflow:hidden; background:#eee; display:flex; justify-content:center; align-items:center; border:3px solid #222; }
.mp-disc-center img { width:100%; height:100%; object-fit:cover; }
.mp-info-area { padding:20px 30px; text-align:center; z-index:1; }
.mp-info-area h2 { font-size:22px; font-weight:700; color:#111; margin:0 0 5px; }
.mp-info-area p { font-size:14px; color:#666; margin:0; }
.mp-controls-area { padding:0 30px 12px 30px; z-index:1; }
.mp-icon-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding:0 10px; }
.mp-icon-row svg { width:22px; height:22px; fill:#666; cursor:pointer; }
.mp-progress-container { display:flex; align-items:center; gap:10px; margin-bottom:20px; font-size:12px; color:#666; }
.mp-progress-bar { flex:1; height:4px; background:#ddd; border-radius:2px; position:relative; cursor:pointer; }
.mp-progress-fill { position:absolute; top:0; left:0; height:100%; background:#111; border-radius:2px; width:0%; }
.mp-progress-thumb { position:absolute; top:50%; left:0%; width:12px; height:12px; background:#111; border-radius:50%; transform:translate(-50%, -50%); cursor:pointer; display:none; }
.mp-play-controls { display:flex; justify-content:space-between; align-items:center; padding:0 10px; }
.mp-play-controls svg { width:28px; height:28px; fill:#333; cursor:pointer; }
.play-main { width:60px; height:60px; border-radius:50%; background:#111111; display:flex; justify-content:center; align-items:center; }
.play-main svg { width:28px; height:28px; fill:#ffffff; }

/* 下拉菜单 */
.wx-dropdown { position:absolute; top:50px; right:12px; background:#222; border-radius:10px; overflow:hidden; z-index:100; display:none; }
.wx-dropdown.show { display:block; }
.wx-dropdown-item { color:#fff; padding:12px 16px; font-size:15px; cursor:pointer; white-space:nowrap; }
.wx-dropdown-item:active { background:rgba(255,255,255,0.15); }

/* 暗黑模式 */
#wechatScreen.dark-mode { --wx-bg:#111; --wx-text:#fff; --wx-text-secondary:#aaa; --wx-border:#333; --wx-search-bg:#1f1f1f; }
#wechatScreen.dark-mode .wx-chat-item,
#wechatScreen.dark-mode .wx-contact-item,
#wechatScreen.dark-mode .wx-moment-item,
#wechatScreen.dark-mode .wx-chat-detail-item { background:#1f1f1f; border-color:#333; }
#wechatScreen.dark-mode .wx-header,
#wechatScreen.dark-mode .wx-tabbar,
#wechatScreen.dark-mode .wx-chat-input-bar { background:#1f1f1f; }
#wechatScreen.dark-mode .wx-chat-preview,
#wechatScreen.dark-mode .wx-contact-info p,
#wechatScreen.dark-mode .wx-chat-time { color:#aaa; }
#wechatScreen.dark-mode .wx-search-box { background:#333; }
#wechatScreen.dark-mode .wx-select-item { background:#333; color:#fff; }
#wechatScreen.dark-mode .wx-select-item.selected { background:#0f3b2d; border-color:#10B981; color:#10B981; }
#wechatScreen.dark-mode .wx-modal-content { background:#1f1f1f; color:#fff; }
#wechatScreen.dark-mode .wx-moment-like-comment,
#wechatScreen.dark-mode .wx-moment-comment-list { background:#333; }

input[type="file"] { display:none; }
</style>
